task:
  type: sei_osr

data:
  name: comp_opt_curated
  path: /mnt/sbd1_newdisk/project_test_1_22/dataset/competition_dataset/source_COMP_opt_10k_10u.pickle
  split_mode: fixed
  split_seed: 42
  num_known: 10
  num_unknown: 10
  train_samples_per_class: 100
  pool_and_resplit: false

augment:
  enabled: true
  k_segments: 2
  phase_mode: quadrant
  concat_original: false
  label_smoothing: 0.2

train:
  batch_size: 32
  val_batch_size: 128
  epochs: 230
  lr: 0.001
  log_every: 10

calib:
  mode: fixed_k
  k_val: 1.0

eval:
  batch_size: 128
  cluster_unknowns: false
  k_grid_report: [0.5, 1.0, 1.5, 2.0]
